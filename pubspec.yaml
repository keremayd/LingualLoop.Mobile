name: lingualloop
description: "lingualloopmobile"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  confetti: ^0.7.0
  flutter:
    sdk: flutter
  http: ^1.2.2  # Geri döndük
  flutter_secure_storage: ^9.2.2
  dio: ^4.0.0
  json_annotation: ^4.8.0  # Bu da çalışıyor
  provider: ^6.0.0
  cupertino_icons: ^1.0.8
  google_sign_in: ^6.0.0
  path_provider: ^2.0.0
  image_picker: ^1.0.5
  just_audio: ^0.10.6
  audio_session: ^0.2.4

dev_dependencies:
  build_runner: ^2.3.3
  json_serializable: ^6.5.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rubik-ExtraBold.ttf
          weight: 800
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
  assets:
    - assets/fonts/Rubik-LICENSE.txt
    - assets/fonts/Baloo2-LICENSE.txt
    # Icons
    # Maskot — seri 0 hâlinde teşvik pozu. 1x yolu yazılır,
    # 2.0x/3.0x varyantlarını Flutter otomatik toplar (§2.12).
    # Güne özel seri sahneleri (§2.12 yoğunluk varyantlarıyla)
