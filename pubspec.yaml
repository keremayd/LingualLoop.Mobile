    - assets/scenes/istikrar_guclendirir.png
    - assets/scenes/seni_ozledik.png
    - assets/scenes/ruzgari_yakala.png
    - assets/scenes/serin_korundu.png
    - assets/scenes/kendi_rekorun.png
